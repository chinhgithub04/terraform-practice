name: 'Terraform Infrastructure'

on:
  push:
    branches: ['main', 'dev', 'production']
  pull_request:
    branches: ['main']

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash # Sử dụng bash shell để chạy các lệnh Terraform

    steps:
      # 1. Checkout code from the repository
      - name: Checkout
        uses: actions/checkout@v4
        # 2. Determine which environment to deploy
      - name: Determine Environment
        id: environment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "env_path=environments/dev" >> $GITHUB_OUTPUT
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/production" ]; then
            echo "env_path=environments/prod" >> $GITHUB_OUTPUT
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_path=." >> $GITHUB_OUTPUT
            echo "env_name=main" >> $GITHUB_OUTPUT
          fi
        # 3. Configure AWS Credentials using the role ARN stored in GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # Secret đã tạo ở GitHub
          aws-region: us-east-1
        # 4. Setup Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        # 5. Initialize Terraform
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ steps.environment.outputs.env_path }}
        # 6. Format Terraform files
      - name: Terraform Format
        run: terraform fmt -check # -check có nghĩa là chỉ kiểm tra định dạng mà không sửa lỗi, nếu có lỗi sẽ làm cho bước này thất bại
        working-directory: ${{ steps.environment.outputs.env_path }}
        # 7. Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ steps.environment.outputs.env_path }}
        # 8. Plan Terraform changes
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan # -out=tfplan sẽ lưu kế hoạch vào file tfplan để sử dụng ở bước apply sau này
        working-directory: ${{ steps.environment.outputs.env_path }}
        # 9. Apply Terraform changes (chỉ khi push vào dev hoặc production)
      - name: Terraform Apply
        if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/production') && github.event_name == 'push'
        run: terraform apply -input=false tfplan # -tfplan sẽ áp dụng kế hoạch đã được lưu ở bước plan trước đó
        working-directory: ${{ steps.environment.outputs.env_path }}
